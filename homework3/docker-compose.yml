version: "3.8"

services:
  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=12345
      - DB_NAME=MtsGolangHomework
      - HTTP_PORT=8081
  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=MtsGolangHomework
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: